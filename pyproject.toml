[project]
name = "gemma4-explorations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.13.0",
    "huggingface-hub>=1.11.0",
    "msgpack>=1.0.0",
    "pyzmq>=26.0.0",
    "sentencepiece>=0.2.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.5.4",
    "vllm @ https://wheels.vllm.ai/529c671e8075d265a48b72e0eaaeb5e30d2f1630/vllm-0.20.1rc1.dev136%2Bg529c671e8-cp38-abi3-manylinux_2_34_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"

[dependency-groups]
dev = [
    "ipython>=9.12.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu129"
